name: Ergebnisse aktualisieren

on:
  schedule:
    # Zeiten in UTC (Winterzeit +1 Stunde, Sommerzeit +2 Stunden)
    - cron: "*/30 10-19 * * 0,6"   # Sa + So alle 30 Minuten, ca. 11 bis 21 Uhr: Schnellmodus
    - cron: "0 7 * * 1"            # Mo früh: letzte drei Wochen, für spät eingetragene Ergebnisse
    - cron: "0 16 * * 1"           # Mo nachmittags: letzte drei Wochen
    - cron: "0 3 * * 3"            # Mi nachts: alle Spielpläne komplett (Terminänderungen)
  workflow_dispatch:                # von Hand: Actions › Ergebnisse aktualisieren › Run workflow
  push:
    branches: [main]                # nach jeder Änderung neu veröffentlichen

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Spielpläne und Ergebnisse holen und im Repository speichern
  ergebnisse:
    runs-on: ubuntu-latest
    outputs:
      privat: ${{ steps.sichtbarkeit.outputs.privat }}
      geaendert: ${{ steps.speichern.outputs.geaendert }}
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abrufart bestimmen
        id: modus
        run: |
          case "${{ github.event.schedule }}" in
            "*/30 10-19 * * 0,6") echo "arg=--quick" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * 3")          echo "arg=--full"  >> "$GITHUB_OUTPUT" ;;
            *)                    echo "arg="        >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Spielpläne und Ergebnisse von bosselergebnis.info abrufen
        run: python scripts/update_data.py ${{ steps.modus.outputs.arg }}

      - name: Neue Daten speichern
        id: speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten.json
          if git diff --cached --quiet; then
            echo "geaendert=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Spielpläne und Ergebnisse aktualisiert"
            git push
            echo "geaendert=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ist das Repository privat?
        id: sichtbarkeit
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "privat=$(gh api repos/$GITHUB_REPOSITORY --jq .private)" >> "$GITHUB_OUTPUT"

  # 2) Webseite veröffentlichen, wenn sich etwas geändert hat (und das Repository öffentlich ist)
  seite:
    needs: ergebnisse
    if: needs.ergebnisse.outputs.privat == 'false' && (needs.ergebnisse.outputs.geaendert == 'true' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aktuellen Stand holen
        uses: actions/checkout@v4
        with:
          ref: main

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Seite veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
